plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ovh.delhomme.maps'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        def isLegacy = project.hasProperty('legacyAppId')
        applicationId isLegacy ? 'ovh.delhomme.maps' : 'cloud.hubera.maps'
        minSdk 26
        targetSdk 35
        versionCode 133
        versionName '0.1.133'
        // Fuel hubera-maps:// : un seul paquet (canonical) pour éviter le chooser 2 icônes.
        manifestPlaceholders.mapsFuelScheme = isLegacy ? 'cloudity-maps' : 'hubera-maps'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ''
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-session:1.5.0'
    implementation project(':hubera-id-sso')
}
